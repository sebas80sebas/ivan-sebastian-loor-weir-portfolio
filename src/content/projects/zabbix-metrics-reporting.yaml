caseStudy:
  overview:
    en: Monitoring data is only useful if it reaches the people who need it. I led the development of a fully automated pipeline that pulls key metrics from multiple Zabbix servers, keeps their history in Azure Storage, builds Excel reports and posts them to Microsoft Teams — with no one assembling spreadsheets by hand.
    es: Los datos de monitorización solo son útiles si llegan a quien los necesita. Lideré el desarrollo de un flujo totalmente automatizado que extrae métricas clave de varios servidores Zabbix, guarda su histórico en Azure Storage, genera informes Excel y los publica en Microsoft Teams — sin que nadie monte hojas de cálculo a mano.
  context:
    en: In ALIANDO’s Managed Services area, client environments are monitored with Zabbix, often across several Zabbix servers. Periodic reporting on key metrics was part of the service.
    es: En el área Managed Services de ALIANDO, los entornos de los clientes se monitorizan con Zabbix, a menudo con varios servidores Zabbix. El reporting periódico de métricas clave formaba parte del servicio.
  problem:
    en: Gathering metrics from several Zabbix servers, consolidating them and producing reports by hand is slow, repetitive and error-prone, and leaves no centralised history to compare periods.
    es: Recoger métricas de varios servidores Zabbix, consolidarlas y producir informes a mano es lento, repetitivo y propenso a errores, y no deja un histórico centralizado para comparar periodos.
  responsibilities:
    en:
      - Led the design and development of the data-collection system.
      - Implemented the collection and reporting logic in Python on Azure Functions.
      - Integrated multiple Zabbix servers as data sources.
      - Automated report delivery to Microsoft Teams.
    es:
      - Lideré el diseño y desarrollo del sistema de recogida de datos.
      - Implementé la lógica de recogida y reporting en Python sobre Azure Functions.
      - Integré varios servidores Zabbix como fuentes de datos.
      - Automaticé la entrega de informes en Microsoft Teams.
  architecture:
    en: A serverless Azure Function written in Python queries each Zabbix server through its API, writes the collected metrics to Azure Blob Storage as a centralised history, generates an Excel report and delivers it to a Microsoft Teams channel. The Function and its storage are deployed with Terraform.
    es: Una Azure Function serverless escrita en Python consulta cada servidor Zabbix a través de su API, escribe las métricas en Azure Blob Storage como histórico centralizado, genera un informe Excel y lo entrega en un canal de Microsoft Teams. La Function y su almacenamiento se despliegan con Terraform.
