  implementation:
    en:
      - Serverless execution on Azure Functions — no servers to patch for a periodic workload.
      - One collector that iterates over multiple Zabbix servers, so adding a source is configuration, not code.
      - Historical data centralised in Blob Storage, making period-over-period comparison possible.
      - Report generation and delivery automated end to end, with Teams as the delivery channel the team already used.
      - Infrastructure for the solution declared in Terraform.
    es:
      - Ejecución serverless en Azure Functions — sin servidores que parchear para una carga periódica.
      - Un único colector que recorre varios servidores Zabbix, de modo que añadir una fuente es configuración, no código.
      - Histórico centralizado en Blob Storage, que permite comparar periodos.
      - Generación y entrega de informes automatizadas de extremo a extremo, con Teams como canal que el equipo ya utilizaba.
      - La infraestructura de la solución declarada en Terraform.
  challenges:
    - challenge:
        en: Data spread across several independent Zabbix servers.
        es: Datos repartidos en varios servidores Zabbix independientes.
      decision:
        en: Centralise collection in a single function and persist results in one storage location, giving a single source of truth for reporting.
        es: Centralizar la recogida en una única función y persistir los resultados en un solo almacenamiento, con una única fuente de verdad para el reporting.
    - challenge:
        en: Reports are only valuable if they actually reach their audience.
        es: Los informes solo aportan valor si llegan a su audiencia.
      decision:
        en: Deliver directly into Microsoft Teams instead of leaving files in storage for someone to fetch.
        es: Entregarlos directamente en Microsoft Teams en lugar de dejar ficheros en el almacenamiento para que alguien los recoja.
  security:
    en:
      - Zabbix API credentials and the Teams delivery endpoint are secrets — they belong in application configuration, never in source code.
      - The function needs read access to Zabbix and write access to its own storage; nothing broader.
    es:
      - Las credenciales de la API de Zabbix y el endpoint de entrega en Teams son secretos — pertenecen a la configuración de la aplicación, nunca al código fuente.
      - La función necesita acceso de lectura a Zabbix y de escritura a su propio almacenamiento; nada más amplio.
  operations:
    en:
      - Fully automated — collection, storage, report generation and delivery run without manual steps.
      - Serverless compute means no infrastructure to maintain for a workload that runs periodically.
    es:
      - Totalmente automatizado — recogida, almacenamiento, generación y entrega sin pasos manuales.
      - El cómputo serverless evita mantener infraestructura para una carga que se ejecuta periódicamente.
  results:
    en:
      - Manual multi-server reporting replaced by an automated pipeline.
      - Reduced operational costs and improved reporting efficiency.
      - Centralised metric history available for analysis.
    es:
      - El reporting manual multiservidor sustituido por un flujo automatizado.
      - Reducción de costes operativos y mejora de la eficiencia del reporting.
      - Histórico de métricas centralizado disponible para análisis.
  lessons:
    en:
      - Automate the whole path to the reader, not just the data collection.
      - Serverless is a natural fit for periodic glue workloads between platforms.
    es:
      - Hay que automatizar todo el camino hasta el lector, no solo la recogida de datos.
      - Serverless encaja de forma natural en cargas periódicas de integración entre plataformas.
