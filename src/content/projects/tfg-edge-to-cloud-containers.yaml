  implementation:
    en:
      - A class hierarchy of task types — ApptainerTask, DockerTask, KubernetesTask, NomadTask and their remote variants — so users switch runtime without changing how the workflow is written.
      - Credentials and connection parameters centralised in a configuration file (dagon.ini) rather than embedded in workflow code.
      - Volume-based staging for Docker, Apptainer and Nomad; streaming between pods for Kubernetes, removing the assumption of a shared filesystem.
      - Benchmarks implemented as DAGonStar workflows, from edge-only runs to distributed Edge–Fog execution and a complete Edge–Fog–Cloud IoT telemetry workflow.
      - Energy, CPU, RAM and temperature monitored in real time with Grafana dashboards per runtime, and post-processed with Python and Matplotlib.
    es:
      - Una jerarquía de clases de tareas — ApptainerTask, DockerTask, KubernetesTask, NomadTask y sus variantes remotas — para cambiar de runtime sin modificar cómo se escribe el workflow.
      - Credenciales y parámetros de conexión centralizados en un fichero de configuración (dagon.ini) en lugar de embebidos en el código del workflow.
      - Staging basado en volúmenes para Docker, Apptainer y Nomad; streaming entre pods para Kubernetes, eliminando la suposición de un sistema de ficheros compartido.
      - Benchmarks implementados como workflows de DAGonStar, desde ejecuciones solo en el edge hasta ejecución distribuida Edge–Fog y un workflow completo de telemetría IoT Edge–Fog–Cloud.
      - Energía, CPU, RAM y temperatura monitorizadas en tiempo real con dashboards de Grafana por runtime, y postprocesadas con Python y Matplotlib.
  challenges:
    - challenge:
        en: No shared filesystem between Edge, Fog and Cloud nodes.
        es: No hay sistema de ficheros compartido entre los nodos Edge, Fog y Cloud.
      decision:
        en: A transversal staging layer that picks the mechanism per runtime — shared host volumes, SSH/SCP, or pod-to-pod streaming.
        es: Una capa de staging transversal que elige el mecanismo por runtime — volúmenes compartidos en el host, SSH/SCP o streaming entre pods.
    - challenge:
        en: Comparing runtimes fairly when they processed different amounts of work (Nomad handled ~150 records, Docker and Apptainer ~292).
        es: Comparar runtimes de forma justa cuando procesaron distinta cantidad de trabajo (Nomad gestionó ~150 registros; Docker y Apptainer, ~292).
      decision:
        en: Normalise energy by workload (joules per record) instead of comparing raw energy totals.
        es: Normalizar la energía por carga de trabajo (julios por registro) en lugar de comparar totales brutos.
    - challenge:
        en: Kubernetes (k3s/k0s) on a Raspberry Pi 5 with an 8 GB SD card became unstable during long runs as cluster components and images filled the disk.
        es: Kubernetes (k3s/k0s) en una Raspberry Pi 5 con tarjeta SD de 8 GB se volvió inestable en ejecuciones largas al llenar el disco los componentes del clúster y las imágenes.
      decision:
        en: Keep the KubernetesTask implementation (fully functional) but report the hardware limitation as a finding, and support lighter runtimes or delegation to the Fog tier.
        es: Mantener la implementación de KubernetesTask (plenamente funcional) pero documentar la limitación de hardware como resultado, y soportar runtimes más ligeros o la delegación a la capa Fog.
  security:
    en:
      - Remote execution and data transfers run over SSH/SCP rather than unauthenticated channels.
      - Connection credentials kept in a dedicated configuration file, separate from workflow definitions.
      - Identified as future work — end-to-end encryption in staging and secret vaults with automatic rotation for regulated data.
    es:
      - La ejecución remota y las transferencias de datos van sobre SSH/SCP y no por canales sin autenticar.
      - Credenciales de conexión en un fichero de configuración dedicado, separado de las definiciones de workflow.
      - Identificado como trabajo futuro — cifrado de extremo a extremo en el staging y cofres de secretos con rotación automática para datos regulados.
  operations:
    en:
      - Thermal impact matters on the edge — Nomad’s higher CPU use (10.8% mean vs 0.38% for Apptainer) raised operating temperature by about 5 °C, a throttling risk in long-running or hot deployments.
      - Apptainer’s efficiency depends on pre-built images and active storage management; Docker and Nomad handle image distribution more transparently at a higher baseline cost.
    es:
      - El impacto térmico importa en el edge — el mayor uso de CPU de Nomad (10,8 % de media frente al 0,38 % de Apptainer) elevó la temperatura de operación unos 5 °C, un riesgo de throttling en despliegues largos o calurosos.
      - La eficiencia de Apptainer depende de imágenes preconstruidas y de gestionar activamente el almacenamiento; Docker y Nomad gestionan la distribución de imágenes de forma más transparente con un mayor coste base.
  results:
    en:
      - Apptainer was the most efficient runtime on the edge node — 1.68 J per record, with under 1% orchestration overhead.
      - Apptainer reduced energy consumption by 26% compared with Docker and 43% compared with Nomad.
      - Docker offered a balanced profile for heterogeneous Edge–Fog deployments; Nomad suits centralised multi-node orchestration but not low-latency, energy-constrained edge workloads.
      - Kubernetes executors are functional, but k3s/k0s proved unviable on minimal edge hardware — a documented finding with future work on multi-Pi or HPC clusters.
    es:
      - Apptainer fue el runtime más eficiente en el nodo edge — 1,68 J por registro, con menos de un 1 % de overhead de orquestación.
      - Apptainer redujo el consumo energético un 26 % respecto a Docker y un 43 % respecto a Nomad.
      - Docker ofreció un perfil equilibrado para despliegues Edge–Fog heterogéneos; Nomad encaja en orquestación multinodo centralizada, pero no en cargas edge de baja latencia con restricciones energéticas.
      - Los ejecutores de Kubernetes son funcionales, pero k3s/k0s resultaron inviables en hardware edge mínimo — un resultado documentado, con trabajo futuro en clústeres de varias Raspberry Pi o HPC.
