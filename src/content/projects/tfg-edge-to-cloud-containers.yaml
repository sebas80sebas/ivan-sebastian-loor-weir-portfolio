caseStudy:
  overview:
    en: Edge-to-Cloud infrastructures mix ARM devices, desktop machines and managed cloud services, with no shared filesystem between them. My thesis extended DAGonStar — a DAG-based scientific workflow engine — so the same workflow can run its tasks in Docker, Kubernetes (k3s/k0s), Nomad or Apptainer, locally or on remote nodes, and then measured what each choice costs in time, resources and energy.
    es: Las infraestructuras edge-to-cloud combinan dispositivos ARM, equipos de escritorio y servicios cloud gestionados, sin un sistema de ficheros compartido. Mi TFG extendió DAGonStar — un motor de workflows científicos basado en DAGs — para que un mismo workflow pueda ejecutar sus tareas en Docker, Kubernetes (k3s/k0s), Nomad o Apptainer, en local o en nodos remotos, y después midió lo que cuesta cada opción en tiempo, recursos y energía.
  context:
    en: Bachelor’s thesis in Computer Engineering at Universidad Carlos III de Madrid (2025–2026), supervised by Dante Domizzi Sánchez Gallegos and awarded 9.5/10. The testbed combined a Fog node (desktop PC acting as orchestrator), an Edge node (Raspberry Pi 5 reading a DHT11 temperature/humidity sensor through an Arduino) and a Cloud tier (MongoDB Atlas).
    es: Trabajo Fin de Grado en Ingeniería Informática en la Universidad Carlos III de Madrid (2025–2026), tutorizado por Dante Domizzi Sánchez Gallegos y calificado con 9,5/10. El testbed combinaba un nodo Fog (PC de escritorio como orquestador), un nodo Edge (Raspberry Pi 5 que leía un sensor DHT11 de temperatura y humedad a través de un Arduino) y una capa Cloud (MongoDB Atlas).
  problem:
    en: Distributed workflows across Edge, Fog and Cloud face three problems — dependency isolation, portability across heterogeneous hardware (x86_64 and ARMv8), and moving intermediate data between nodes that share no filesystem. Choosing a container runtime for constrained edge devices also has measurable consequences for latency, energy and hardware temperature that are rarely quantified.
    es: Los workflows distribuidos entre Edge, Fog y Cloud se enfrentan a tres problemas — aislamiento de dependencias, portabilidad entre hardware heterogéneo (x86_64 y ARMv8) y movimiento de datos intermedios entre nodos sin sistema de ficheros compartido. Elegir un runtime de contenedores para dispositivos edge limitados tiene además consecuencias medibles en latencia, energía y temperatura que rara vez se cuantifican.
  responsibilities:
    en:
      - Designed and implemented task classes for Apptainer, Docker, Kubernetes and Nomad, each with a remote variant, behind DAGonStar’s homogeneous task interface.
      - Built a cross-runtime staging mechanism (Stager and Data Mover) combining host-shared areas, SSH/SCP transfers and pod-to-pod streaming for Kubernetes.
      - Integrated Prometheus, Node Exporter and Grafana to monitor execution time, resource usage, temperature and energy.
      - Designed and ran single-node, distributed and full IoT-telemetry experiments, and analysed the results.
    es:
      - Diseñé e implementé clases de tareas para Apptainer, Docker, Kubernetes y Nomad, cada una con su variante remota, tras la interfaz homogénea de tareas de DAGonStar.
      - Construí un mecanismo de staging entre runtimes (Stager y Data Mover) que combina áreas compartidas en el host, transferencias SSH/SCP y streaming entre pods para Kubernetes.
      - Integré Prometheus, Node Exporter y Grafana para monitorizar tiempo de ejecución, uso de recursos, temperatura y energía.
      - Diseñé y ejecuté experimentos de nodo único, distribuidos y de telemetría IoT completa, y analicé los resultados.
  architecture:
    en: The Fog node runs DAGonStar and orchestrates tasks on the Edge node over SSH. On the Edge, the selected runtime — Docker, Apptainer, Nomad or k3s/k0s — executes the tasks that capture and process sensor data. The Stager/Data Mover moves intermediate files between tasks and nodes, results are persisted in MongoDB Atlas, and Node Exporter metrics are scraped by Prometheus and visualised in Grafana.
    es: El nodo Fog ejecuta DAGonStar y orquesta tareas en el nodo Edge por SSH. En el Edge, el runtime elegido — Docker, Apptainer, Nomad o k3s/k0s — ejecuta las tareas que capturan y procesan los datos del sensor. El Stager/Data Mover mueve los ficheros intermedios entre tareas y nodos, los resultados se persisten en MongoDB Atlas y las métricas de Node Exporter las recoge Prometheus y se visualizan en Grafana.
