  lessons:
    en:
      - Normalise before you compare — raw totals hid that Nomad spent most of its energy on orchestration rather than useful work.
      - Runtime choice is an infrastructure decision with energy, thermal and hardware-lifetime consequences, not only a developer preference.
      - Heterogeneous infrastructure needs an engine that can pick the lightest viable runtime per node, or delegate work upstream.
    es:
      - Normalizar antes de comparar — los totales brutos ocultaban que Nomad dedicaba la mayor parte de su energía a la orquestación y no a trabajo útil.
      - Elegir runtime es una decisión de infraestructura con consecuencias energéticas, térmicas y de vida útil del hardware, no solo una preferencia de desarrollo.
      - Una infraestructura heterogénea necesita un motor capaz de elegir el runtime viable más ligero en cada nodo, o de delegar el trabajo hacia arriba.
