summary:
  en: Bachelor’s thesis (9.5/10). Extended the DAGonStar workflow engine with Docker, Kubernetes (k3s/k0s), Nomad and Apptainer executors and a cross-runtime data-staging layer, then measured performance, overhead and energy on a real Edge–Fog–Cloud testbed.
  es: Trabajo Fin de Grado (9,5/10). Extensión del motor de workflows DAGonStar con ejecutores para Docker, Kubernetes (k3s/k0s), Nomad y Apptainer y una capa de staging de datos entre runtimes, con medición de rendimiento, overhead y energía sobre un testbed Edge–Fog–Cloud real.
