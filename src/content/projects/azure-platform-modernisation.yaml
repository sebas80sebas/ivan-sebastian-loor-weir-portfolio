  implementation:
    en:
      - One Terraform codebase for every environment; environments differ by configuration, not by code — the precondition for parity between sbx and prod.
      - Services composed from reusable modules, with custom modules written where a requirement was not covered.
      - Azure DevOps pipelines as the only deployment path, so every change to an environment is planned, applied and recorded the same way.
      - OpenShift UPI clusters on Azure handled as infrastructure code too — provisioning and lifecycle steps automated through Terraform and pipelines rather than run by hand.
      - Architecture artefacts (Solution Designs, ADRs, HLDs, LLDs, BoQs) maintained alongside the implementation so decisions stay traceable.
    es:
      - Un único código Terraform para todos los entornos; los entornos difieren en configuración, no en código — la condición previa para la paridad entre sbx y prod.
      - Servicios compuestos a partir de módulos reutilizables, con módulos propios donde un requisito no estaba cubierto.
      - Los pipelines de Azure DevOps como única vía de despliegue, de modo que cada cambio en un entorno se planifica, aplica y registra igual.
      - Los clústeres OpenShift UPI sobre Azure también tratados como código — aprovisionamiento y ciclo de vida automatizados con Terraform y pipelines en lugar de ejecutarse a mano.
      - Artefactos de arquitectura (Solution Designs, ADRs, HLDs, LLDs, BoQs) mantenidos junto a la implementación para que las decisiones sean trazables.
  challenges:
    - challenge:
        en: Deployments blocked by dependencies between layers — a data or AI service cannot be completed until the platform resources it relies on exist and are reachable.
        es: Despliegues bloqueados por dependencias entre capas — un servicio de datos o IA no puede completarse hasta que existen y son accesibles los recursos de plataforma de los que depende.
      decision:
        en: Treat dependency unblocking as engineering work — trace failures to the missing prerequisite, fix it in the module or configuration, and re-run through the pipeline instead of patching the environment manually.
        es: Tratar el desbloqueo de dependencias como trabajo de ingeniería — rastrear el fallo hasta el prerrequisito ausente, corregirlo en el módulo o la configuración y relanzar desde el pipeline en lugar de parchear el entorno a mano.
    - challenge:
        en: Requirements that existing modules did not cover.
        es: Requisitos que los módulos existentes no cubrían.
      decision:
        en: Write custom modules rather than inline one-off resources, so the gap is closed once for every environment.
        es: Escribir módulos propios en lugar de recursos puntuales, de modo que el hueco se cierra una vez para todos los entornos.
    - challenge:
        en: Running OpenShift with user-provisioned infrastructure (UPI) on Azure, where the platform team owns the underlying infrastructure.
        es: Ejecutar OpenShift con infraestructura aprovisionada por el usuario (UPI) en Azure, donde el equipo de plataforma es responsable de la infraestructura subyacente.
      decision:
        en: Automate provisioning and lifecycle management with the same Terraform + Azure DevOps toolchain used for the rest of the estate.
        es: Automatizar el aprovisionamiento y el ciclo de vida con la misma cadena Terraform + Azure DevOps que el resto del estate.
  security:
    en:
      - Secrets and keys centralised in Azure Key Vault as part of each environment rather than embedded in code or pipelines.
      - Pipeline-only changes give a reviewable, auditable trail for every modification to the platform.
      - Client architecture, network design and identifiers are confidential — this case study describes the approach, not the estate.
    es:
      - Secretos y claves centralizados en Azure Key Vault dentro de cada entorno, en lugar de embebidos en código o pipelines.
      - Los cambios solo vía pipeline dejan un rastro revisable y auditable de cada modificación de la plataforma.
      - La arquitectura del cliente, el diseño de red y los identificadores son confidenciales — este caso describe el enfoque, no el estate.
  operations:
    en:
      - Environment parity makes issues reproducible in lower environments before they reach production.
      - Successive releases extend the same codebase instead of starting new, divergent deployments.
      - Lifecycle operations on OpenShift clusters run through automation, reducing manual intervention on critical infrastructure.
    es:
      - La paridad entre entornos permite reproducir problemas en entornos inferiores antes de que lleguen a producción.
      - Las releases sucesivas amplían el mismo código en lugar de iniciar despliegues nuevos y divergentes.
      - Las operaciones de ciclo de vida de los clústeres OpenShift se ejecutan mediante automatización, reduciendo la intervención manual sobre infraestructura crítica.
  results:
    en:
      - Complete environment set (sbx, dev, qa, pre, prod) provisioned for Release 0 and Release 1.
      - 40+ Azure services across networking, data, AI and platform layers delivered through Terraform and Azure DevOps.
      - OpenShift UPI clusters on Azure delivered and operated with automated provisioning and lifecycle management.
    es:
      - Conjunto completo de entornos (sbx, dev, qa, pre, prod) aprovisionado para Release 0 y Release 1.
      - Más de 40 servicios de Azure en las capas de red, datos, IA y plataforma entregados con Terraform y Azure DevOps.
      - Clústeres OpenShift UPI sobre Azure entregados y operados con aprovisionamiento y ciclo de vida automatizados.
  lessons:
    en:
      - Environment parity is a property of the codebase, not of discipline — if environments share code and differ only by configuration, drift has nowhere to hide.
      - Much of real IaC work is dependency management between layers; modules should make those dependencies explicit.
      - Architecture documents and code should evolve together; an ADR is most useful when the implementation it justifies is one pull request away.
    es:
      - La paridad entre entornos es una propiedad del código, no de la disciplina — si los entornos comparten código y solo difieren en configuración, la deriva no tiene dónde esconderse.
      - Gran parte del trabajo real de IaC es gestionar dependencias entre capas; los módulos deben hacerlas explícitas.
      - Documentación de arquitectura y código deben evolucionar juntos; un ADR es más útil cuando la implementación que justifica está a un pull request de distancia.
