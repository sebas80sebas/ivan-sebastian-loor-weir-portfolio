      es: Vista lógica — un código, cinco entornos, servicios por capas
    description:
      en: Architecture documentation informs Terraform modules stored in Git; Azure DevOps pipelines run plan and apply against five environments (sbx, dev, qa, pre, prod). Each environment contains a platform layer, a data layer, an AI and integration layer, and a networking layer.
      es: La documentación de arquitectura guía los módulos Terraform en Git; los pipelines de Azure DevOps ejecutan plan y apply sobre cinco entornos (sbx, dev, qa, pre, prod). Cada entorno contiene una capa de plataforma, una de datos, una de IA e integración y una capa de red.
    note:
