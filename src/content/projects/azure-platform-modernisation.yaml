caseStudy:
  confidential: true
  overview:
    en: A national-scale tax-administration modernisation programme needed its Azure estate built consistently, environment after environment and release after release. My work was turning that estate into code — Terraform modules executed by Azure DevOps pipelines — and keeping deployments moving when dependencies between layers blocked them.
    es: Un programa de modernización de la administración tributaria a escala nacional necesitaba construir su estate en Azure de forma consistente, entorno tras entorno y release tras release. Mi trabajo consistió en convertir ese estate en código — módulos Terraform ejecutados por pipelines de Azure DevOps — y mantener los despliegues avanzando cuando las dependencias entre capas los bloqueaban.
  context:
    en: The engagement sits in ALIANDO’s Cloud Platform area, focused on cloud infrastructure modernisation and DevOps automation for an international public-sector client. The platform spans five environments (sandbox, development, QA, pre-production and production) and was delivered in successive releases — Release 0 and Release 1.
    es: El proyecto se enmarca en el área Cloud Platform de ALIANDO, centrada en la modernización de infraestructura cloud y la automatización DevOps para un cliente internacional del sector público. La plataforma abarca cinco entornos (sandbox, desarrollo, QA, preproducción y producción) y se entregó en releases sucesivas — Release 0 y Release 1.
  problem:
    en: More than forty Azure services across networking, data, AI and platform layers had to exist identically in every environment, with dependencies between them (identity, secrets, networking, data services) that make ordering and configuration drift real risks. Manual or per-environment provisioning would not scale to five environments and multiple releases, nor survive audit.
    es: Más de cuarenta servicios de Azure en las capas de red, datos, IA y plataforma debían existir de forma idéntica en cada entorno, con dependencias entre ellos (identidad, secretos, red, servicios de datos) que convierten el orden de despliegue y la deriva de configuración en riesgos reales. Un aprovisionamiento manual o por entorno no escalaría a cinco entornos y varias releases, ni resistiría una auditoría.
  responsibilities:
    en:
      - Provisioned complete environments (sbx, dev, qa, pre, prod) for Release 0 and Release 1 through Terraform modules and Azure DevOps pipelines.
      - Developed custom Terraform modules where existing ones did not cover the requirement.
      - Troubleshot failed deployments and unblocked cross-layer dependencies so releases could progress.
      - Delivered and operated OpenShift UPI clusters on Azure, automating provisioning and lifecycle management with Terraform and Azure DevOps.
      - Contributed to Solution Designs, ADRs, HLDs, LLDs, architecture diagrams and Bills of Quantities.
    es:
      - Aprovisioné entornos completos (sbx, dev, qa, pre, prod) para Release 0 y Release 1 mediante módulos Terraform y pipelines de Azure DevOps.
      - Desarrollé módulos Terraform propios donde los existentes no cubrían el requisito.
      - Resolví despliegues fallidos y desbloqueé dependencias entre capas para que las releases avanzaran.
      - Entregué y operé clústeres OpenShift UPI sobre Azure, automatizando su aprovisionamiento y ciclo de vida con Terraform y Azure DevOps.
      - Contribuí a Solution Designs, ADRs, HLDs, LLDs, diagramas de arquitectura y BoQs.
  architecture:
    en: Every environment is described by the same Terraform codebase and differs only in configuration. Azure DevOps pipelines run plan and apply per environment. Each environment hosts the same logical layers — a platform layer (OpenShift UPI nodes, Container Registry, Key Vault, Redis Cache, Storage, IaaS VMs), a data layer, an AI layer and integration services — on top of a networking layer whose topology is intentionally not shown here.
    es: Cada entorno se describe con el mismo código Terraform y solo difiere en configuración. Los pipelines de Azure DevOps ejecutan plan y apply por entorno. Cada entorno aloja las mismas capas lógicas — una capa de plataforma (nodos OpenShift UPI, Container Registry, Key Vault, Redis Cache, Storage, VMs IaaS), una capa de datos, una capa de IA y servicios de integración — sobre una capa de red cuya topología no se muestra intencionadamente.
  diagram:
