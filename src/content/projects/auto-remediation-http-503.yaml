  implementation:
    en:
      - Detection based on application telemetry, so the signal is what users actually experience — 503 responses — rather than an indirect host metric.
      - Alert logic expressed in KQL, which keeps the detection rule explicit, reviewable and easy to tune.
      - Remediation implemented as an Azure Automation runbook, so the fix is the same scripted action every time.
      - Platform-native wiring — alert rule → action group → runbook — with no extra infrastructure to run.
    es:
      - Detección basada en la telemetría de la aplicación, de modo que la señal es lo que experimentan los usuarios — respuestas 503 — y no una métrica indirecta del host.
      - Lógica de alerta expresada en KQL, lo que mantiene la regla explícita, revisable y fácil de ajustar.
      - Remediación implementada como runbook de Azure Automation, de modo que la solución es siempre la misma acción scriptada.
      - Integración nativa de la plataforma — regla de alerta → action group → runbook — sin infraestructura adicional que operar.
  challenges:
    - challenge:
        en: Distinguishing real service degradation from noise.
        es: Distinguir una degradación real del ruido.
      decision:
        en: Base the alert on a KQL query over request telemetry, where conditions and thresholds can be expressed precisely and adjusted without changing the remediation.
        es: Basar la alerta en una consulta KQL sobre la telemetría de peticiones, donde condiciones y umbrales se expresan con precisión y se ajustan sin tocar la remediación.
    - challenge:
        en: Making the remediation repeatable and safe to run unattended.
        es: Hacer la remediación repetible y segura para ejecutarse sin supervisión.
      decision:
        en: Encapsulate it in a single runbook scoped to restarting the affected VMs, rather than a broader set of ad-hoc actions.
        es: Encapsularla en un único runbook limitado a reiniciar las VMs afectadas, en lugar de un conjunto más amplio de acciones ad hoc.
  security:
    en:
      - An unattended runbook should run under an identity with only the permissions needed to restart the target VMs.
      - Keeping the remediation narrow (restart only) limits the impact of a false positive.
    es:
      - Un runbook desatendido debe ejecutarse con una identidad que solo tenga los permisos necesarios para reiniciar las VMs objetivo.
      - Mantener la remediación acotada (solo reinicio) limita el impacto de un falso positivo.
  operations:
    en:
      - Recovery no longer waits for an operator to respond to the alert.
      - Alert history and runbook job history give a record of every automated intervention.
      - Restart is a mitigation, not a root-cause fix — automated recoveries remain visible for follow-up.
    es:
      - La recuperación ya no espera a que un operador responda a la alerta.
      - El histórico de alertas y de ejecuciones del runbook deja constancia de cada intervención automática.
      - Reiniciar es una mitigación, no una corrección de causa raíz — las recuperaciones automáticas siguen visibles para su seguimiento.
  results:
    en:
      - HTTP 503 failures detected and remediated automatically, without human intervention.
      - Faster incident response for a known, recurring failure mode.
    es:
      - Fallos HTTP 503 detectados y remediados automáticamente, sin intervención humana.
      - Respuesta más rápida ante un modo de fallo conocido y recurrente.
  lessons:
    en:
      - Automate known fixes for known failures, and keep the automation as narrow as the fix.
      - Alerting on user-facing signals produces more meaningful automation than alerting on infrastructure proxies.
    es:
      - Automatizar soluciones conocidas para fallos conocidos, y mantener la automatización tan acotada como la solución.
      - Alertar sobre señales que ve el usuario produce una automatización más significativa que alertar sobre indicadores de infraestructura.
