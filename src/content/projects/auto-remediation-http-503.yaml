category:
  en: Reliability automation
  es: Automatización de fiabilidad
title:
  en: Automated remediation of HTTP 503 failures on Azure
  es: Remediación automática de fallos HTTP 503 en Azure
summary:
  en: Application Insights telemetry and KQL-based Azure Monitor alert rules detect HTTP 503 degradation and trigger an Azure Automation runbook that restarts the affected virtual machines — no human in the loop.
  es: La telemetría de Application Insights y reglas de alerta de Azure Monitor basadas en KQL detectan degradaciones HTTP 503 y disparan un runbook de Azure Automation que reinicia las máquinas virtuales afectadas, sin intervención humana.
outcome:
  en: Detection-to-recovery without manual intervention
  es: De la detección a la recuperación sin intervención manual
role:
  en: Designer and implementer
  es: Diseño e implementación
period: '2025'
org:
  en: ALIANDO · Managed Services area
  es: ALIANDO · Área Managed Services
stack:
  - Application Insights
  - Azure Monitor
  - KQL
  - Azure Automation
  - PowerShell
repo: https://github.com/sebas80sebas/azure-auto-remediation-503
caseStudy:
  overview:
    en: A recurring failure mode with a known fix is a candidate for automation. I designed and implemented a closed loop on Azure that detects HTTP 503 errors from application telemetry and restarts the affected VMs automatically.
    es: Un modo de fallo recurrente con una solución conocida es candidato a automatización. Diseñé e implementé un ciclo cerrado en Azure que detecta errores HTTP 503 a partir de la telemetría de la aplicación y reinicia automáticamente las VMs afectadas.
  context:
    en: Azure-hosted applications running on virtual machines, operated by ALIANDO’s Managed Services area, where HTTP 503 (Service Unavailable) failures required an operator to notice the degradation and restart the service.
    es: Aplicaciones alojadas en Azure sobre máquinas virtuales, operadas por el área Managed Services de ALIANDO, en las que los fallos HTTP 503 (Service Unavailable) requerían que un operador detectara la degradación y reiniciara el servicio.
  problem:
    en: Each 503 incident depended on a human — someone had to see the alert, diagnose and restart the VM. Time to recovery was bounded by response time, not by how long the fix takes.
    es: Cada incidente 503 dependía de una persona — alguien debía ver la alerta, diagnosticar y reiniciar la VM. El tiempo de recuperación lo marcaba el tiempo de respuesta, no lo que tarda la solución.
  responsibilities:
    en:
      - Designed the end-to-end detection and remediation flow.
      - Wrote the KQL queries behind the alert rules.
      - Implemented the Azure Automation runbook that restarts the affected VMs.
    es:
      - Diseñé el flujo de detección y remediación de extremo a extremo.
      - Escribí las consultas KQL de las reglas de alerta.
      - Implementé el runbook de Azure Automation que reinicia las VMs afectadas.
  architecture:
    en: Application Insights collects request telemetry from the application. An Azure Monitor log alert rule evaluates a KQL query for HTTP 503 responses; when it fires, an action group invokes an Azure Automation runbook written in PowerShell, which restarts the affected virtual machines.
    es: Application Insights recoge la telemetría de peticiones de la aplicación. Una regla de alerta de logs de Azure Monitor evalúa una consulta KQL sobre las respuestas HTTP 503; cuando se dispara, un action group invoca un runbook de Azure Automation escrito en PowerShell que reinicia las máquinas virtuales afectadas.
