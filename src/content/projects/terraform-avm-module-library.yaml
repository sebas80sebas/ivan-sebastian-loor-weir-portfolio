caseStudy:
  overview:
    en: Landing-zone deployments are only as fast and as safe as the modules they are assembled from. I built Terraform modules aligned with Azure Verified Modules (AVM) standards so that teams could compose platforms from tested, versioned building blocks — with private networking, encryption, identity and diagnostics available by design rather than bolted on.
    es: Los despliegues de landing zones son tan rápidos y seguros como los módulos con los que se montan. Desarrollé módulos Terraform alineados con los estándares de Azure Verified Modules (AVM) para que los equipos compongan plataformas a partir de bloques probados y versionados — con red privada, cifrado, identidad y diagnóstico disponibles por diseño, no añadidos a posteriori.
  context:
    en: Part of ALIANDO’s “Cloud Factory” initiative, whose goal is to accelerate and standardise Azure landing-zone deployments. AVM is Microsoft’s standard for Terraform and Bicep modules, defining consistent interfaces for cross-cutting concerns such as private endpoints, locks, role assignments and diagnostic settings.
    es: Forma parte de la iniciativa “Cloud Factory” de ALIANDO, cuyo objetivo es acelerar y estandarizar los despliegues de landing zones en Azure. AVM es el estándar de Microsoft para módulos Terraform y Bicep, con interfaces homogéneas para aspectos transversales como private endpoints, locks, role assignments y diagnostic settings.
  problem:
    en: Without a shared module layer, each deployment re-implements the same resources slightly differently, and security controls depend on whoever writes the code that day. The library needed to give consumers a simple, stable interface while staying close enough to upstream AVM to absorb its improvements.
    es: Sin una capa de módulos compartida, cada despliegue reimplementa los mismos recursos de forma ligeramente distinta y los controles de seguridad dependen de quién escriba el código ese día. La librería debía ofrecer una interfaz simple y estable a los consumidores, manteniéndose lo bastante cerca de AVM upstream como para incorporar sus mejoras.
  responsibilities:
    en:
      - Designed and implemented module wrappers on top of official AVM resource modules, pinning upstream versions.
      - Authored scenario-based examples for each module (default, private endpoint, customer-managed keys and others).
      - Maintained a CHANGELOG per module and evolved modules as upstream AVM versions changed.
      - Defined composition boundaries between modules (for example, AI Foundry consuming AI Search from its dedicated module).
    es:
      - Diseñé e implementé wrappers sobre los módulos de recursos oficiales de AVM, fijando las versiones upstream.
      - Escribí ejemplos por escenario para cada módulo (default, private endpoint, claves gestionadas por el cliente, entre otros).
      - Mantuve un CHANGELOG por módulo y evolucioné los módulos según cambiaban las versiones de AVM upstream.
      - Definí los límites de composición entre módulos (por ejemplo, AI Foundry consumiendo AI Search desde su módulo dedicado).
  architecture:
    en: Each module wraps a pinned upstream AVM module behind a typed interface of variables and outputs, ships runnable examples and a changelog, and is checked with terraform validate and tfsec static analysis. All modules expose the same cross-cutting interfaces — private endpoints, customer-managed keys, managed identities, RBAC role assignments, diagnostic settings and resource locks — so a landing zone can apply one security posture across every service.
    es: Cada módulo envuelve un módulo AVM upstream con versión fijada tras una interfaz tipada de variables y outputs, incluye ejemplos ejecutables y un changelog, y se comprueba con terraform validate y el análisis estático de tfsec. Todos exponen las mismas interfaces transversales — private endpoints, claves gestionadas por el cliente, identidades gestionadas, role assignments RBAC, diagnostic settings y locks — para que una landing zone aplique una única postura de seguridad en todos los servicios.
