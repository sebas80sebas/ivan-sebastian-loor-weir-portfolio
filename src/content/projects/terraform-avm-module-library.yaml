      es: Los Azure Verified Modules upstream se envuelven en un módulo con interfaz tipada, ejemplos y changelog. Los módulos pasan terraform validate y tfsec antes de consumirse en despliegues de landing zones. Cada módulo expone private endpoints, claves gestionadas por el cliente, identidad gestionada, RBAC, diagnóstico y locks.
