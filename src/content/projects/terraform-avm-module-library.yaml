  implementation:
    en:
      - "AKS: built from the AVM managed-cluster module and later upgraded to a newer upstream release, with examples ranging from default and private clusters to a secure-baseline private cluster and a WAF-aligned configuration."
      - "Container Registry: based on the AVM registry module, with examples for geo-replication, private endpoints, CMK encryption, scope maps and registry tokens."
      - "AI Foundry: supports both BYOR (bring your own resources — existing Cosmos DB, Key Vault and Storage) and CYOR (create them inline) patterns, plus a private-endpoint example with public access disabled and DNS managed by Azure Policy."
      - "Azure OpenAI / Cognitive Services: a wrapper that mirrors the full upstream interface — 39 inputs and 11 outputs — with examples for private endpoints, CMK, disabled local auth and Responsible AI policies."
      - "Data Factory, AI Search and Databricks: managed-identity, private-endpoint and diagnostic-settings support, with self-hosted integration runtimes and linked services for Data Factory and VNet injection plus access connectors for Databricks."
    es:
      - "AKS: construido a partir del módulo de managed cluster de AVM y actualizado después a una release upstream más reciente, con ejemplos que van desde clústeres default y privados hasta un clúster privado secure-baseline y una configuración alineada con WAF."
      - "Container Registry: basado en el módulo de registry de AVM, con ejemplos de geo-replicación, private endpoints, cifrado CMK, scope maps y registry tokens."
      - "AI Foundry: soporta los patrones BYOR (traer recursos existentes — Cosmos DB, Key Vault y Storage) y CYOR (crearlos en línea), además de un ejemplo con private endpoints, acceso público deshabilitado y DNS gestionado por Azure Policy."
      - "Azure OpenAI / Cognitive Services: un wrapper que refleja la interfaz upstream completa — 39 inputs y 11 outputs — con ejemplos de private endpoints, CMK, autenticación local deshabilitada y políticas de Responsible AI."
      - "Data Factory, AI Search y Databricks: soporte de identidades gestionadas, private endpoints y diagnostic settings, con self-hosted integration runtimes y linked services en Data Factory, y VNet injection y access connectors en Databricks."
  challenges:
    - challenge:
        en: Keeping wrappers close to upstream AVM without exposing consumers to every upstream change.
        es: Mantener los wrappers cerca de AVM upstream sin exponer a los consumidores a cada cambio upstream.
      decision:
        en: Pin the upstream module version and record every bump in a per-module CHANGELOG, so upgrades are deliberate, reviewable events.
        es: Fijar la versión del módulo upstream y registrar cada actualización en un CHANGELOG por módulo, para que las actualizaciones sean eventos deliberados y revisables.
    - challenge:
        en: Overlapping responsibilities between modules — AI Foundry depends on AI Search, which already has its own naming, networking and RBAC conventions.
        es: Responsabilidades solapadas entre módulos — AI Foundry depende de AI Search, que ya tiene sus propias convenciones de nombres, red y RBAC.
      decision:
        en: Never create AI Search inside the AI Foundry module; consume it by resource ID from its dedicated module. One resource, one owner.
        es: No crear nunca AI Search dentro del módulo de AI Foundry; consumirlo por resource ID desde su módulo dedicado. Un recurso, un propietario.
    - challenge:
        en: Proof-of-concept deployments and production landing zones need different dependency models.
        es: Las pruebas de concepto y las landing zones de producción necesitan modelos de dependencias distintos.
      decision:
        en: Support both BYOR (recommended for production and landing zones) and CYOR (convenient for PoCs and demos), documented side by side in the examples.
        es: Soportar BYOR (recomendado para producción y landing zones) y CYOR (cómodo para PoCs y demos), documentados uno junto al otro en los ejemplos.
  security:
    en:
      - Private endpoints, customer-managed keys, managed identities, RBAC role assignments and resource locks are module inputs, so secure configurations are the documented path.
      - Examples cover hardened scenarios explicitly — private clusters, disabled public access, disabled local authentication, CMK encryption.
      - Module code is checked with tfsec static analysis.
    es:
      - Private endpoints, claves gestionadas por el cliente, identidades gestionadas, role assignments RBAC y locks son inputs de los módulos, de modo que la configuración segura es el camino documentado.
      - Los ejemplos cubren explícitamente escenarios reforzados — clústeres privados, acceso público deshabilitado, autenticación local deshabilitada, cifrado CMK.
      - El código de los módulos se comprueba con el análisis estático de tfsec.
  operations:
    en:
      - Diagnostic settings are part of every module interface, so observability is configured at deployment time.
      - Scenario examples double as documentation and as a fast way to validate a module change end to end.
      - Versioned modules let landing zones upgrade on their own schedule.
    es:
      - Los diagnostic settings forman parte de la interfaz de todos los módulos, así que la observabilidad se configura en el despliegue.
      - Los ejemplos por escenario sirven a la vez de documentación y de forma rápida de validar un cambio de extremo a extremo.
      - Los módulos versionados permiten que cada landing zone se actualice a su ritmo.
  results:
    en:
      - Seven AVM-aligned modules covering container, AI and data services for landing-zone deployments.
      - A consistent security interface across all modules, so one posture can be applied platform-wide.
      - Scenario examples and changelogs that make modules self-documenting and safe to upgrade.
    es:
      - Siete módulos alineados con AVM que cubren servicios de contenedores, IA y datos para despliegues de landing zones.
      - Una interfaz de seguridad homogénea en todos los módulos, para aplicar una única postura en toda la plataforma.
      - Ejemplos por escenario y changelogs que hacen los módulos autodocumentados y seguros de actualizar.
  lessons:
    en:
      - A module’s interface is a security control — what is easy to set is what gets set.
      - Wrapping a standard is more maintainable than forking it; the value is in the opinionated interface, not in copied code.
      - Clear ownership boundaries between modules prevent duplicated resources and conflicting conventions.
    es:
      - La interfaz de un módulo es un control de seguridad — lo que es fácil de configurar es lo que se configura.
      - Envolver un estándar es más mantenible que hacer un fork; el valor está en la interfaz opinada, no en el código copiado.
      - Unos límites de propiedad claros entre módulos evitan recursos duplicados y convenciones en conflicto.
