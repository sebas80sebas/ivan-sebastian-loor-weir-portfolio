  en: A catalogue of Terraform modules built on Azure Verified Modules — AKS, Container Registry, AI Foundry, Azure OpenAI, AI Search, Data Factory and Databricks — with security controls exposed as first-class inputs.
  es: Un catálogo de módulos Terraform construidos sobre Azure Verified Modules — AKS, Container Registry, AI Foundry, Azure OpenAI, AI Search, Data Factory y Databricks — con los controles de seguridad expuestos como inputs de primer nivel.
