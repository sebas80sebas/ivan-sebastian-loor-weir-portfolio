  implementation:
    en:
      - Inventory the existing templates and the behaviour each one guarantees — inputs, ordering, conditions and deployment targets.
      - Re-express each template in GitHub Actions terms, keeping the Terraform commands and their order unchanged.
      - Treat equivalence as the acceptance criterion — the migrated workflows must build and deploy the same way as the originals.
    es:
      - Inventariar las plantillas existentes y el comportamiento que garantiza cada una — inputs, orden, condiciones y destinos de despliegue.
      - Reexpresar cada plantilla en términos de GitHub Actions, manteniendo sin cambios los comandos de Terraform y su orden.
      - Tratar la equivalencia como criterio de aceptación — los workflows migrados deben construir y desplegar igual que los originales.
  challenges:
    - challenge:
        en: Different execution models — Azure DevOps stages and templates do not map one-to-one onto GitHub Actions workflows and jobs.
        es: Modelos de ejecución distintos — los stages y plantillas de Azure DevOps no se corresponden uno a uno con workflows y jobs de GitHub Actions.
      decision:
        en: Map by intent rather than by syntax — identify what each template guarantees and reproduce that guarantee with the closest GitHub Actions construct.
        es: Traducir por intención y no por sintaxis — identificar qué garantiza cada plantilla y reproducir esa garantía con el elemento de GitHub Actions más cercano.
    - challenge:
        en: In infrastructure pipelines, a behavioural difference is a change to real resources.
        es: En pipelines de infraestructura, una diferencia de comportamiento es un cambio en recursos reales.
      decision:
        en: Keep the Terraform workflow itself untouched and limit the migration to the orchestration layer around it.
        es: Mantener intacto el flujo de Terraform y limitar la migración a la capa de orquestación que lo rodea.
  security:
    en:
      - Secrets and variables must keep their scoping when moved between platforms — a variable that was environment-scoped must not become globally readable.
      - Deployment controls on sensitive environments need an explicit equivalent on the target platform.
    es:
      - Secretos y variables deben mantener su ámbito al moverse entre plataformas — una variable con ámbito de entorno no debe pasar a ser legible globalmente.
      - Los controles de despliegue en entornos sensibles necesitan un equivalente explícito en la plataforma destino.
  operations:
    en:
      - Equivalent logic means operators keep the same mental model of how infrastructure is delivered.
      - Reusable workflows keep delivery standards centralised instead of copied into every repository.
    es:
      - Una lógica equivalente permite a los operadores mantener el mismo modelo mental de cómo se entrega la infraestructura.
      - Los reusable workflows mantienen centralizados los estándares de entrega en lugar de copiarlos en cada repositorio.
  results:
    en:
      - Azure DevOps pipeline templates for Terraform IaC translated to GitHub Actions.
      - Equivalent build and deployment logic preserved.
    es:
      - Plantillas de pipelines de Azure DevOps para IaC con Terraform trasladadas a GitHub Actions.
      - Lógica de build y despliegue equivalente preservada.
  lessons:
    en:
      - A pipeline migration is a behaviour-preservation exercise; syntax is the easy part.
      - Separating orchestration from the infrastructure logic it runs makes CI/CD platforms interchangeable.
    es:
      - Una migración de pipelines es un ejercicio de preservación de comportamiento; la sintaxis es la parte fácil.
      - Separar la orquestación de la lógica de infraestructura que ejecuta hace intercambiables las plataformas CI/CD.
