caseStudy:
  overview:
    en: Pipeline templates encode a team’s delivery standards. Moving them from Azure DevOps to GitHub Actions means re-expressing those standards in a different execution model without changing what gets built or deployed. I carried out that translation for Terraform-based IaC workflows.
    es: Las plantillas de pipelines codifican los estándares de entrega de un equipo. Llevarlas de Azure DevOps a GitHub Actions supone reexpresar esos estándares en otro modelo de ejecución sin cambiar qué se construye o se despliega. Realicé esa traducción para los workflows de IaC con Terraform.
  context:
    en: Infrastructure in the Cloud Platform area is delivered through Terraform executed by CI/CD pipelines. Pipeline templates already existed in Azure DevOps; the requirement was to provide the same capability in GitHub Actions.
    es: En el área Cloud Platform la infraestructura se entrega con Terraform ejecutado desde pipelines CI/CD. Las plantillas ya existían en Azure DevOps; el requisito era ofrecer la misma capacidad en GitHub Actions.
  problem:
    en: Azure DevOps and GitHub Actions share concepts but not semantics — templates, stages, variable scoping and approvals are modelled differently. A literal port risks subtle behavioural changes in infrastructure deployments, where a different variable value or a skipped step can change real resources.
    es: Azure DevOps y GitHub Actions comparten conceptos pero no semántica — plantillas, stages, ámbito de variables y aprobaciones se modelan de forma distinta. Un port literal arriesga cambios sutiles de comportamiento en despliegues de infraestructura, donde un valor de variable distinto o un paso omitido puede cambiar recursos reales.
  responsibilities:
    en:
      - Analysed the existing Azure DevOps pipeline templates for Terraform IaC.
      - Translated them into GitHub Actions workflows.
      - Preserved equivalent build and deployment logic across the migration.
    es:
      - Analicé las plantillas de pipelines de Azure DevOps existentes para IaC con Terraform.
      - Las traduje a workflows de GitHub Actions.
      - Preservé una lógica de build y despliegue equivalente durante la migración.
  architecture:
    en: The migration maps each Azure DevOps construct to its GitHub Actions counterpart. The diagram shows that conceptual mapping between the two platforms’ building blocks; the Terraform logic executed inside the pipelines stays the same.
    es: La migración asigna cada elemento de Azure DevOps a su equivalente en GitHub Actions. El diagrama muestra esa correspondencia conceptual entre los bloques de ambas plataformas; la lógica de Terraform que se ejecuta dentro de los pipelines no cambia.
  diagram:
    title:
      en: Conceptual mapping — Azure DevOps constructs to GitHub Actions
      es: Correspondencia conceptual — elementos de Azure DevOps a GitHub Actions
    description:
      en: Azure DevOps pipeline templates map to GitHub Actions reusable workflows; stages, jobs and steps map to jobs and steps; pipeline variables map to workflow inputs, variables and secrets; environments and approvals map to GitHub environments. Both run the same Terraform logic.
      es: Las plantillas de pipelines de Azure DevOps se corresponden con reusable workflows de GitHub Actions; stages, jobs y steps con jobs y steps; las variables del pipeline con inputs, variables y secrets del workflow; environments y aprobaciones con environments de GitHub. Ambos ejecutan la misma lógica de Terraform.
    note:
      en: Conceptual view of the platform constructs involved; it does not reproduce the client’s pipelines.
      es: Vista conceptual de los elementos de plataforma implicados; no reproduce los pipelines del cliente.
