title:
  en: Migrating Terraform pipeline templates from Azure DevOps to GitHub Actions
  es: Migración de plantillas de pipelines Terraform de Azure DevOps a GitHub Actions
summary:
  en: Translated Azure DevOps pipeline templates for Terraform-based Infrastructure as Code into GitHub Actions workflows, preserving equivalent build and deployment logic.
  es: Traslado de plantillas de pipelines de Azure DevOps para Infrastructure as Code con Terraform a workflows de GitHub Actions, preservando una lógica de build y despliegue equivalente.
outcome:
  en: Equivalent IaC delivery logic on a new CI/CD platform
  es: Lógica de entrega IaC equivalente en una nueva plataforma CI/CD
