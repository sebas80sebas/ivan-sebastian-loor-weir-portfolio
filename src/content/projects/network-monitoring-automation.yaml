  implementation:
    en:
      - "ExpressRoute: ingress and egress bandwidth, utilisation, BGP and ARP availability and circuit health brought into Zabbix."
      - "Traffic Manager: endpoint health, queries per second and routing configuration collected from Azure Monitor."
      - "VPN connections onboarded with the same pattern, so all three services alert consistently."
      - "Agent installation driven by Azure CLI Run Command and a PowerShell installer — no RDP session and no interactive credentials on the VM."
      - "Agent package served from Blob Storage so that VMs without internet access can still be provisioned."
    es:
      - "ExpressRoute: ancho de banda de entrada y salida, utilización, disponibilidad BGP y ARP y estado del circuito en Zabbix."
      - "Traffic Manager: salud de endpoints, consultas por segundo y configuración de enrutado recogidas desde Azure Monitor."
      - "Conexiones VPN incorporadas con el mismo patrón, de modo que los tres servicios alertan de forma homogénea."
      - "Instalación del agente mediante Azure CLI Run Command y un instalador PowerShell — sin sesión RDP ni credenciales interactivas en la VM."
      - "Paquete del agente servido desde Blob Storage para que también puedan aprovisionarse VMs sin acceso a internet."
  challenges:
    - challenge:
        en: Managed network services cannot run a monitoring agent.
        es: Los servicios de red gestionados no pueden ejecutar un agente de monitorización.
      decision:
        en: Collect their metrics from the Azure Monitor API and translate them into Zabbix, so they sit next to the rest of the estate in the same alerting model.
        es: Recoger sus métricas desde la API de Azure Monitor y trasladarlas a Zabbix, para que convivan con el resto del estate en el mismo modelo de alertado.
    - challenge:
        en: VMs in isolated private networks cannot download installers from the internet, and RDP access is not always available.
        es: Las VMs de redes privadas aisladas no pueden descargar instaladores de internet, y el acceso por RDP no siempre está disponible.
      decision:
        en: Use Azure Run Command to execute the installer through the Azure control plane and host the package in Blob Storage reachable from the VM.
        es: Usar Azure Run Command para ejecutar el instalador a través del plano de control de Azure y alojar el paquete en un Blob Storage accesible desde la VM.
  security:
    en:
      - Run Command executes through Azure RBAC on the control plane, avoiding open RDP access and shared interactive credentials.
      - Monitoring reads platform metrics only; collectors need read access to metrics, not management rights over the network resources.
    es:
      - Run Command se ejecuta a través de Azure RBAC en el plano de control, evitando abrir RDP y compartir credenciales interactivas.
      - La monitorización solo lee métricas de plataforma; los colectores necesitan acceso de lectura a métricas, no derechos de gestión sobre los recursos de red.
  operations:
    en:
      - Consistent alerting across ExpressRoute, VPN and Traffic Manager.
      - Proactive detection of resource degradation before users report it.
      - Less configuration effort per new circuit, connection, profile or VM.
    es:
      - Alertado homogéneo para ExpressRoute, VPN y Traffic Manager.
      - Detección proactiva de degradaciones antes de que las reporten los usuarios.
      - Menos esfuerzo de configuración por cada nuevo circuito, conexión, perfil o VM.
  results:
    en:
      - Automated monitoring onboarding for ExpressRoute, VPN connections and Traffic Manager.
      - Improved reliability through proactive detection of degradation.
      - Agent provisioning that works on both internet-facing and isolated private networks.
    es:
      - Incorporación automatizada de la monitorización de ExpressRoute, conexiones VPN y Traffic Manager.
      - Mayor fiabilidad gracias a la detección proactiva de degradaciones.
      - Aprovisionamiento de agentes válido tanto en redes con salida a internet como en redes privadas aisladas.
  lessons:
    en:
      - Managed services need a metrics-API path into monitoring; agents only cover what you host.
      - Designing for the most restricted network first produces a rollout that works everywhere.
    es:
      - Los servicios gestionados necesitan una vía por API de métricas hacia la monitorización; los agentes solo cubren lo que alojas.
      - Diseñar primero para la red más restringida da como resultado un despliegue que funciona en cualquier sitio.
