caseStudy:
  overview:
    en: Network services are where outages start and where they are hardest to see. I automated the onboarding of Azure ExpressRoute, VPN connections and Traffic Manager into Zabbix, and built a zero-touch way to install Zabbix agents on VMs — including those in isolated private networks.
    es: Los servicios de red son donde empiezan las caídas y donde más cuesta verlas. Automaticé la incorporación de Azure ExpressRoute, conexiones VPN y Traffic Manager en Zabbix, y construí una forma zero-touch de instalar agentes Zabbix en VMs, incluidas las de redes privadas aisladas.
  context:
    en: Client environments in ALIANDO’s Managed Services area are monitored centrally with Zabbix. Azure’s managed network services expose their health through Azure Monitor rather than through an agent, and many VMs sit in private networks without internet access.
    es: Los entornos de clientes del área Managed Services de ALIANDO se monitorizan de forma centralizada con Zabbix. Los servicios de red gestionados de Azure exponen su estado a través de Azure Monitor y no mediante un agente, y muchas VMs están en redes privadas sin acceso a internet.
  problem:
    en: Configuring monitoring for each circuit, connection and profile by hand is slow and inconsistent, and a monitoring gap on a network service means degradations are found by users. Installing agents manually over RDP does not scale and is not always possible on isolated networks.
    es: Configurar a mano la monitorización de cada circuito, conexión y perfil es lento e inconsistente, y un hueco de monitorización en un servicio de red significa que las degradaciones las descubren los usuarios. Instalar agentes manualmente por RDP no escala y no siempre es posible en redes aisladas.
  responsibilities:
    en:
      - Automated the onboarding of ExpressRoute, VPN connection and Traffic Manager monitoring into Zabbix.
      - Built Python collectors that read Azure Monitor metrics for these services.
      - Engineered a zero-touch Zabbix agent installation workflow using Azure CLI and Blob Storage.
    es:
      - Automaticé la incorporación de la monitorización de ExpressRoute, conexiones VPN y Traffic Manager en Zabbix.
      - Desarrollé colectores en Python que leen las métricas de Azure Monitor de estos servicios.
      - Desarrollé un flujo de instalación zero-touch del agente Zabbix con Azure CLI y Blob Storage.
  architecture:
    en: Two complementary paths. For managed network services, Python collectors query the Azure Monitor metrics API — ExpressRoute ingress/egress bandwidth, BGP and ARP availability and circuit health; Traffic Manager endpoint health, queries per second and routing configuration — and feed them into Zabbix. For virtual machines, Azure CLI Run Command executes an installation script on the VM, which retrieves the agent package from Blob Storage; no RDP session or interactive credentials are required, and the approach works in isolated private networks.
    es: Dos caminos complementarios. Para los servicios de red gestionados, colectores en Python consultan la API de métricas de Azure Monitor — ancho de banda de entrada/salida de ExpressRoute, disponibilidad BGP y ARP y estado del circuito; salud de endpoints, consultas por segundo y configuración de enrutado de Traffic Manager — y las llevan a Zabbix. Para las máquinas virtuales, Azure CLI Run Command ejecuta un script de instalación en la VM, que obtiene el paquete del agente desde Blob Storage; no hace falta sesión RDP ni credenciales interactivas, y funciona en redes privadas aisladas.
  diagram:
    title:
      en: Two onboarding paths into one monitoring platform
      es: Dos vías de incorporación hacia una única plataforma de monitorización
    description:
      en: ExpressRoute circuits, VPN connections and Traffic Manager profiles publish platform metrics to Azure Monitor; Python collectors query the metrics API and send the values to the Zabbix server. Separately, Azure CLI Run Command executes an installer on a Windows VM, which downloads the agent package from Blob Storage; the installed Zabbix agent registers with the Zabbix server.
      es: Los circuitos ExpressRoute, las conexiones VPN y los perfiles de Traffic Manager publican métricas en Azure Monitor; colectores en Python consultan la API de métricas y envían los valores al servidor Zabbix. Por otro lado, Azure CLI Run Command ejecuta un instalador en una VM Windows, que descarga el paquete del agente desde Blob Storage; el agente Zabbix instalado se registra en el servidor Zabbix.
