title:
  en: Automated Zabbix monitoring for Azure network services and private VMs
  es: Monitorización automatizada con Zabbix de servicios de red Azure y VMs privadas
summary:
  en: Python collectors that bring ExpressRoute, VPN and Traffic Manager metrics from Azure Monitor into Zabbix, plus a zero-touch agent rollout that works on internet-facing and isolated private networks alike.
  es: Colectores en Python que llevan las métricas de ExpressRoute, VPN y Traffic Manager desde Azure Monitor a Zabbix, y un despliegue zero-touch de agentes que funciona igual en redes con salida a internet y en redes privadas aisladas.
outcome:
