      - Diseñé y documenté Solution Designs, ADRs, HLDs, LLDs, diagramas de arquitectura y BoQs para iniciativas de modernización y migración.
      - Orquesté el despliegue de extremo a extremo de la infraestructura para cargas SAP en Azure con SAP Deployment Automation Framework (SDAF), ejecutando Terraform y PowerShell desde pipelines de Azure DevOps.
      - Migré plantillas de pipelines de Azure DevOps a GitHub Actions, trasladando los flujos de IaC con Terraform y preservando una lógica de build y despliegue equivalente.
      - Desarrollé módulos Terraform alineados con los estándares de Azure Verified Modules (AVM) para acelerar despliegues de landing zones dentro de la iniciativa “Cloud Factory”.
