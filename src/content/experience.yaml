- id: aliando-azure-cloud-administrator
  order: 2
  company: ALIANDO
  role:
    en: Azure Cloud Administrator
    es: Azure Cloud Administrator
  start: '2025-09'
  end: '2026-01'
  location:
    en: Madrid, Spain
    es: Madrid, España
  workMode:
    en: Hybrid
    es: Híbrido
  area:
    en: Managed Services
    es: Managed Services
  clients: []
  clientsAnonymized:
    en: Enterprise clients in the Middle East and Spain — rail, energy, asset management, retail and industry
    es: Clientes enterprise en Oriente Medio y España — ferrocarril, energía, gestión de activos, retail e industria
  summary:
    en: Azure deployments, infrastructure automation, monitoring and incident management for enterprise clients.
    es: Despliegues en Azure, automatización de infraestructura, monitorización y gestión de incidencias para clientes enterprise.
  highlights:
    en:
      - Led the development of an automated data-collection system in Python on Azure Functions that integrated multiple Zabbix servers, centralised historical metrics in Azure Storage, generated Excel reports and delivered them to Microsoft Teams — reducing operational effort and improving reporting efficiency.
      - Automated the onboarding of Azure ExpressRoute, VPN connections and Traffic Manager monitoring into Zabbix, giving consistent alerting and proactive detection of resource degradation.
      - Designed and implemented automated remediation for HTTP 503 failures, using Application Insights and Azure Monitor KQL-based alert rules to trigger an Azure Automation runbook that restarts the affected VMs.
      - Engineered a zero-touch Zabbix agent installation workflow with Azure CLI and Blob Storage that works on both internet-facing VMs and isolated private networks.
      - Assisted in Azure Kubernetes Service (AKS) cluster upgrades, validating service continuity and post-upgrade stability.
      - Supported Azure infrastructure audits covering Azure Red Hat OpenShift (ARO), CycleCloud and Spring Cloud, and handled VM troubleshooting — log rotation, disk optimisation and RDP session persistence for migrated workloads.
    es:
      - Lideré el desarrollo de un sistema automatizado de recogida de datos en Python sobre Azure Functions que integraba varios servidores Zabbix, centralizaba el histórico de métricas en Azure Storage, generaba informes Excel y los entregaba en Microsoft Teams, reduciendo esfuerzo operativo y mejorando la eficiencia del reporting.
      - Automaticé la incorporación de la monitorización de Azure ExpressRoute, conexiones VPN y Traffic Manager en Zabbix, con alertado homogéneo y detección proactiva de degradaciones.
      - "Diseñé e implementé la remediación automática de fallos HTTP 503: alertas basadas en consultas KQL sobre Application Insights y Azure Monitor que disparan un runbook de Azure Automation para reiniciar las VMs afectadas."
      - Desarrollé un flujo de instalación zero-touch del agente Zabbix con Azure CLI y Blob Storage, válido tanto para VMs con salida a internet como para redes privadas aisladas.
      - Participé en upgrades de clústeres de Azure Kubernetes Service (AKS), validando la continuidad del servicio y la estabilidad posterior.
      - "Apoyé auditorías de infraestructura Azure sobre Azure Red Hat OpenShift (ARO), CycleCloud y Spring Cloud, y resolví incidencias en VMs: rotación de logs, optimización de disco y persistencia de sesiones RDP en cargas migradas."
  stack:
    - Azure
    - Python
    - Azure Functions
    - Zabbix
    - Azure Monitor
    - Application Insights
    - KQL
    - Azure Automation
    - PowerShell
    - Azure CLI
    - AKS
  projects:
