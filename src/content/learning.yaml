# Focus areas and course completions. Courses are NOT certifications and must
# never be counted as such.
- id: focus-iac
  kind: focus
  order: 0
  title: { en: Terraform & IaC at scale, es: Terraform e IaC a escala }
  description:
    en: Module design, multi-environment patterns and the delivery workflows around Infrastructure as Code.
    es: Diseño de módulos, patrones multientorno y los flujos de entrega alrededor de Infrastructure as Code.
- id: focus-architecture
  kind: focus
  order: 1
  title: { en: Azure solution architecture, es: Arquitectura de soluciones en Azure }
  description:
    en: Landing zones, design trade-offs and the documentation that justifies them — ADRs, HLDs and LLDs.
    es: Landing zones, trade-offs de diseño y la documentación que los justifica — ADRs, HLDs y LLDs.
- id: focus-aks
  kind: focus
  order: 5
  title: { en: Managed Kubernetes (AKS), es: Kubernetes gestionado (AKS) }
  description:
    en: Deploying and operating AKS as part of the wider platform — networking, identity, security and observability.
    es: Desplegar y operar AKS como parte de la plataforma — red, identidad, seguridad y observabilidad.
- id: focus-devsecops
  kind: focus
  order: 3
  title: { en: DevSecOps & supply-chain security, es: DevSecOps y seguridad de la cadena de suministro }
  description:
    en: Security controls in pipelines and module interfaces — code scanning, secret protection, dependency review.
    es: Controles de seguridad en pipelines e interfaces de módulos — code scanning, protección de secretos, revisión de dependencias.
- id: focus-ai
  kind: focus
  order: 4
  title: { en: AI engineering & agentic systems, es: AI engineering y sistemas agénticos }
  description:
    en: Building with LLM APIs, MCP and agent tooling — and how AI-assisted engineering fits into secure delivery.
    es: Construir con APIs de LLM, MCP y herramientas de agentes — y cómo encaja la ingeniería asistida por IA en una entrega segura.

